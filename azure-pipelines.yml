variables:
- name: BuildParameters.solution
  value: '**\*.sln'
- name: BuildParameters.ArtifactName
  value: drop
- name: BuildParameters.FortifyProjects
  value: WebGoat
- name: BuildParameters.sscCiToken
  value: d36ccf73-5cb2-470a-9c4f-ed3e342f6194
- name: BuildParameters.scanCentralClientToken
  value: 0a9ee484-2ef1-4d50-91e1-2eab2cdf1542
- name: FORTIFY_API_KEY
  value: 5bca5531-60dc-4e97-a90e-14eb02867cbf
- name: FORTIFY_API_SECRET
  value: NlMzTml5MGZQYllyaWFWPHAvdktDcnc1OGlEU3Ep0
trigger:
  branches:
    include:
    - master
  batch: True
name: $(date:yyyyMMdd)$(rev:.r)
jobs:
- job: Job_1
  displayName: Build WebGoat.NET
  pool:
    name: Fortify
  steps:
  - checkout: self
    clean: true
    fetchTags: false
  - task: NuGetToolInstaller@1
    displayName: Use NuGet 6.13.2
    inputs:
      versionSpec: 6.13.2
  - task: NuGetCommand@2
    displayName: NuGet restore
    inputs:
      solution: $(BuildParameters.solution)
  - task: VSBuild@1
    displayName: Build solution
    inputs:
      solution: $(BuildParameters.solution)
      vsVersion: "17.0"
      msbuildArgs: /p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:SkipInvalidConfigurations=true /p:PackageLocation="$(build.artifactstagingdirectory)\\"
      platform: $(BuildPlatform)
      configuration: $(BuildConfiguration)
      msbuildArchitecture: x64
  - task: VSTest@2
    displayName: Test Assemblies
    inputs:
      testAssemblyVer2: >-
        **\$(BuildConfiguration)\*test*.dll

        !**\obj\**
      platform: $(BuildPlatform)
      configuration: $(BuildConfiguration)
  - task: PublishSymbols@2
    displayName: Publish symbols path
    continueOnError: True
    inputs:
      SearchPattern: '**\bin\**\*.pdb'
      PublishSymbols: false
      SymbolServerType: TeamServices
  - task: PublishBuildArtifacts@1
    displayName: Publish Artifact
    condition: succeededOrFailed()
    inputs:
      PathtoPublish: $(build.artifactstagingdirectory)
      ArtifactName: $(BuildParameters.ArtifactName)
      TargetPath: '\\my\share\$(Build.DefinitionName)\$(Build.BuildNumber)'
  - task: FortifyOnDemandStatic@8
    displayName: Run Fortify on Demand static assessment
    enabled: False
    inputs:
      FortifyProjects: $(BuildParameters.FortifyProjects)
      FodConnection: b1e932bd-31c6-46cf-b212-65124515961c
      ScanCentralLocation: 'C:\Fortify_ScanCentral_Client\bin'
      ReleaseOptions: 0
      ReleaseId: 229633
      EntitlementSelection: 1
      EntitlementPreference: 1
      OverrideScanSettings: 2
      InProgressScanActionType: 1
      RemediationScanPreference: 2
      BuildType: msbuild
      PollingInterval: 0
      PolicyFailAction: 0
  - task: FortifyReport@13
    inputs:
      providerType: 'fod'
      fodUrl: 'https://api.ams.fortify.com'
      fodApiKey: '$(FORTIFY_API_KEY)'
      fodApiSecret: '$(FORTIFY_API_SECRET)'
      appName: 'WebGoat (NET)'
      appVersion: 'phil_test'